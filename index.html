<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NutriAI" />
  <title>AI Nutrition & Calorie Tracker</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel do kompilacji JSX w locie -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Ukrycie standardowych pasków przewijania dla efektu aplikacji mobilnej */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ZESTAW IKON SVG (Brak zewnętrznych zależności) ---
    const Icon = ({ name, className = "w-5 h-5", filled = false }) => {
      const icons = {
        home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        pencil: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />,
        chevronLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />,
        chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
        camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9zM15 13a3 3 0 11-6 0 3 3 0 016 0z" />,
        type: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h7" />,
        barcode: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v16m4-16v16m4-16v16m4-16v16m4-16v16" />,
        heart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
      };

      return (
        <svg
          className={className}
          fill={filled ? "currentColor" : "none"}
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          {icons[name] || null}
        </svg>
      );
    };

    // --- MOTYWY KOLORYSTYCZNE ---
    const THEMES = [
      { id: 'light', name: 'Jasny', bg: 'bg-white', text: 'text-gray-900', border: 'border-gray-200', primary: 'bg-emerald-600', isDark: false },
      { id: 'dark', name: 'Ciemny', bg: 'bg-zinc-900', text: 'text-zinc-100', border: 'border-zinc-800', primary: 'bg-emerald-500', isDark: true },
      { id: 'emerald', name: 'Natura', bg: 'bg-emerald-950', text: 'text-emerald-100', border: 'border-emerald-800', primary: 'bg-emerald-500', isDark: true },
      { id: 'ocean', name: 'Ocean', bg: 'bg-slate-900', text: 'text-sky-100', border: 'border-sky-900', primary: 'bg-sky-500', isDark: true },
      { id: 'purple', name: 'Fiolet', bg: 'bg-indigo-950', text: 'text-purple-100', border: 'border-indigo-900', primary: 'bg-purple-500', isDark: true },
      { id: 'rose', name: 'Malina', bg: 'bg-rose-950', text: 'text-rose-100', border: 'border-rose-900', primary: 'bg-rose-500', isDark: true }
    ];

    // --- DOMYŚLNE DANE ---
    const DEFAULT_PROFILE = {
      gender: 'male',
      age: '28',
      weight: '78',
      height: '182',
      activity: '1.4',
      goal: 'maintain'
    };

    const DEFAULT_FAVORITES = [
      {
        id: 'fav-1',
        name: 'Kawa z mlekiem 2%',
        components: [
          {
            name: 'Kawa z mlekiem',
            selectedUnit: 'kubek',
            amount: 1,
            isHeaped: false,
            unitWeights: { 'kubek': 250, 'łyżka': 15, 'g': 1 },
            allowedUnits: ['kubek', 'łyżka', 'g'],
            caloriesPer100g: 38,
            proteinPer100g: 2.2,
            carbsPer100g: 3.5,
            fatPer100g: 1.5
          }
        ]
      }
    ];

    // --- GŁÓWNY KOMPONENT APLIKACJI ---
    function App() {
      // 1. Stany globalne z localStorage
      const [theme, setTheme] = useState(() => localStorage.getItem('nutri_theme') || 'light');
      const [profile, setProfile] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('nutri_profile')) || DEFAULT_PROFILE;
        } catch(e) { return DEFAULT_PROFILE; }
      });
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('nutri_gemini_api_key') || '');
      const [dailyLogs, setDailyLogs] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('nutri_daily_logs')) || {};
        } catch(e) { return {}; }
      });
      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('nutri_favorites')) || DEFAULT_FAVORITES;
        } catch(e) { return DEFAULT_FAVORITES; }
      });

      // Nawigacja
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'add' | 'profile'
      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);

      // Modal edycji wpisu
      const [editingMeal, setEditingMeal] = useState(null);

      // Zapisywanie zmian w localStorage
      useEffect(() => localStorage.setItem('nutri_theme', theme), [theme]);
      useEffect(() => localStorage.setItem('nutri_profile', JSON.stringify(profile)), [profile]);
      useEffect(() => localStorage.setItem('nutri_gemini_api_key', apiKey), [apiKey]);
      useEffect(() => localStorage.setItem('nutri_daily_logs', JSON.stringify(dailyLogs)), [dailyLogs]);
      useEffect(() => localStorage.setItem('nutri_favorites', JSON.stringify(favorites)), [favorites]);

      // Aktualny motyw
      const currentThemeObj = THEMES.find(t => t.id === theme) || THEMES[0];

      // Wyliczanie zapotrzebowania (Mifflin-St Jeor)
      const calculatedTargets = useMemo(() => {
        const w = parseFloat(profile.weight) || 70;
        const h = parseFloat(profile.height) || 175;
        const a = parseFloat(profile.age) || 30;
        const act = parseFloat(profile.activity) || 1.4;

        let bmr = (10 * w) + (6.25 * h) - (5 * a);
        bmr = profile.gender === 'female' ? bmr - 161 : bmr + 5;
        let tdee = bmr * act;

        if (profile.goal === 'cut') tdee -= 400;
        if (profile.goal === 'bulk') tdee += 300;

        const calories = Math.max(1200, Math.round(tdee));
        const protein = Math.round(w * 2.0); // 2g na kg
        const fat = Math.round((calories * 0.25) / 9); // 25% z tłuszczu
        const carbs = Math.max(50, Math.round((calories - (protein * 4) - (fat * 9)) / 4));

        return { calories, protein, carbs, fat };
      }, [profile]);

      // Statystyki dla wybranego dnia
      const currentDayMeals = dailyLogs[selectedDate] || [];
      const currentDayTotals = useMemo(() => {
        return currentDayMeals.reduce((acc, meal) => {
          acc.calories += meal.totalCalories || 0;
          acc.protein += meal.totalProtein || 0;
          acc.carbs += meal.totalCarbs || 0;
          acc.fat += meal.totalFat || 0;
          return acc;
        }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
      }, [currentDayMeals]);

      // Usuwanie posiłku
      const handleDeleteMeal = (mealId) => {
        if (!confirm("Czy na pewno usunąć ten posiłek?")) return;
        setDailyLogs(prev => ({
          ...prev,
          [selectedDate]: (prev[selectedDate] || []).filter(m => m.id !== mealId)
        }));
      };

      // Zapis zaktualizowanego posiłku z modala edycji
      const handleSaveEditedMeal = (updatedMeal, saveToFavs = false) => {
        setDailyLogs(prev => ({
          ...prev,
          [selectedDate]: (prev[selectedDate] || []).map(m => m.id === updatedMeal.id ? updatedMeal : m)
        }));

        if (saveToFavs) {
          setFavorites(prev => {
            const exists = prev.find(f => f.name.toLowerCase() === updatedMeal.name.toLowerCase());
            if (exists) return prev;
            return [...prev, { id: 'fav-' + Date.now(), name: updatedMeal.name, components: updatedMeal.components }];
          });
        }
        setEditingMeal(null);
      };

      return (
        <div className={`min-h-screen ${currentThemeObj.bg} ${currentThemeObj.text} pb-24 font-sans antialiased transition-colors duration-200`}>
          {/* GÓRNY PASEK (Minimalistyczny) */}
          <header className={`sticky top-0 z-30 px-5 py-3.5 border-b ${currentThemeObj.border} ${currentThemeObj.bg}/90 backdrop-blur-md flex items-center justify-between`}>
            <div className="flex items-center space-x-2">
              <span className={`w-3 h-3 rounded-full ${currentThemeObj.primary}`}></span>
              <h1 className="text-lg font-bold tracking-tight">NutriAI</h1>
            </div>
            <span className="text-xs font-medium px-2 py-1 rounded bg-black/5 dark:bg-white/10 opacity-70">
              {currentThemeObj.name}
            </span>
          </header>

          {/* GŁÓWNA TREŚĆ - PRZEŁĄCZANIE ZAKŁADEK */}
          <main className="max-w-md mx-auto px-4 pt-4">
            {/* ZAKŁADKA 1: DASHBOARD / START */}
            {activeTab === 'dashboard' && (
              <DashboardView
                selectedDate={selectedDate}
                setSelectedDate={setSelectedDate}
                totals={currentDayTotals}
                targets={calculatedTargets}
                meals={currentDayMeals}
                onDeleteMeal={handleDeleteMeal}
                onEditMeal={(meal) => setEditingMeal(meal)}
                theme={currentThemeObj}
              />
            )}

            {/* ZAKŁADKA 2: DODAWANIE (Ukrywana, by zachować progres!) */}
            <div style={{ display: activeTab === 'add' ? 'block' : 'none' }}>
              <AddMealWizard
                selectedDate={selectedDate}
                apiKey={apiKey}
                theme={currentThemeObj}
                favorites={favorites}
                onMealAdded={(newMeal, saveToFavs) => {
                  setDailyLogs(prev => ({
                    ...prev,
                    [selectedDate]: [...(prev[selectedDate] || []), newMeal]
                  }));
                  if (saveToFavs) {
                    setFavorites(prev => [...prev, { id: 'fav-' + Date.now(), name: newMeal.name, components: newMeal.components }]);
                  }
                  setActiveTab('dashboard');
                }}
              />
            </div>

            {/* ZAKŁADKA 3: PROFIL / USTAWIENIA */}
            {activeTab === 'profile' && (
              <ProfileView
                profile={profile}
                setProfile={setProfile}
                targets={calculatedTargets}
                apiKey={apiKey}
                setApiKey={setApiKey}
                theme={theme}
                setTheme={setTheme}
                themeObj={currentThemeObj}
                dailyLogs={dailyLogs}
                setDailyLogs={setDailyLogs}
              />
            )}
          </main>

          {/* MODAL EDYCJI POSIŁKU */}
          {editingMeal && (
            <EditMealModal
              meal={editingMeal}
              theme={currentThemeObj}
              onClose={() => setEditingMeal(null)}
              onSave={handleSaveEditedMeal}
            />
          )}

          {/* DOLNY PASEK NAWIGACYJNY (Tab Bar) */}
          <nav className={`fixed bottom-0 left-0 right-0 z-40 border-t ${currentThemeObj.border} ${currentThemeObj.bg}/95 backdrop-blur-lg`}>
            <div className="max-w-md mx-auto grid grid-cols-3 h-16">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`flex flex-col items-center justify-center space-y-1 transition-colors ${activeTab === 'dashboard' ? 'text-emerald-500 font-semibold' : 'opacity-60 hover:opacity-100'}`}
              >
                <Icon name="home" className="w-5 h-5" />
                <span className="text-xs">Start</span>
              </button>

              <button
                onClick={() => setActiveTab('add')}
                className={`flex flex-col items-center justify-center space-y-1 transition-colors ${activeTab === 'add' ? 'text-emerald-500 font-semibold' : 'opacity-60 hover:opacity-100'}`}
              >
                <div className="w-10 h-10 -mt-4 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                  <Icon name="plus" className="w-6 h-6" />
                </div>
                <span className="text-xs">Dodaj</span>
              </button>

              <button
                onClick={() => setActiveTab('profile')}
                className={`flex flex-col items-center justify-center space-y-1 transition-colors ${activeTab === 'profile' ? 'text-emerald-500 font-semibold' : 'opacity-60 hover:opacity-100'}`}
              >
                <Icon name="user" className="w-5 h-5" />
                <span className="text-xs">Profil</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    // --- WIDOK 1: DASHBOARD ---
    function DashboardView({ selectedDate, setSelectedDate, totals, targets, meals, onDeleteMeal, onEditMeal, theme }) {
      // Nawigacja dniami
      const changeDay = (offset) => {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + offset);
        setSelectedDate(d.toISOString().split('T')[0]);
      };

      const isToday = selectedDate === new Date().toISOString().split('T')[0];
      const isDaySkipped = meals.length === 0;

      // Wyliczanie % wypełnienia celów
      const macroBars = [
        { label: 'Kalorie', val: totals.calories, target: targets.calories, unit: 'kcal', color: 'bg-emerald-500' },
        { label: 'Białko', val: totals.protein, target: targets.protein, unit: 'g', color: 'bg-blue-500' },
        { label: 'Węgle', val: totals.carbs, target: targets.carbs, unit: 'g', color: 'bg-amber-500' },
        { label: 'Tłuszcze', val: totals.fat, target: targets.fat, unit: 'g', color: 'bg-rose-500' },
      ];

      return (
        <div className="space-y-4">
          {/* PRZEŁĄCZNIK DATY */}
          <div className={`p-3 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 flex items-center justify-between`}>
            <button onClick={() => changeDay(-1)} className="p-2 rounded-xl hover:bg-black/10 dark:hover:bg-white/10 active:scale-90">
              <Icon name="chevronLeft" className="w-5 h-5" />
            </button>
            <div className="text-center">
              <p className="text-xs opacity-60 font-medium uppercase tracking-wider">{isToday ? "Dzisiaj" : "Data"}</p>
              <p className="text-sm font-bold">{selectedDate}</p>
            </div>
            <button onClick={() => changeDay(1)} className="p-2 rounded-xl hover:bg-black/10 dark:hover:bg-white/10 active:scale-90">
              <Icon name="chevronRight" className="w-5 h-5" />
            </button>
          </div>

          {/* STATUS DNIA OMINIĘTEGO */}
          {isDaySkipped && (
            <div className="p-2.5 rounded-xl border border-dashed border-amber-500/40 bg-amber-500/10 text-amber-600 dark:text-amber-400 text-center text-xs font-medium">
              Dzień ominięty (brak wpisów – nie zaniża średniej)
            </div>
          )}

          {/* WYKRESY SŁUPKOWE POSTĘPU (Z szarym tłem 100% celu) */}
          <div className={`p-4 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 space-y-3.5`}>
            {macroBars.map((m, idx) => {
              const pct = m.target > 0 ? Math.min(100, Math.round((m.val / m.target) * 100)) : 0;
              return (
                <div key={idx} className="space-y-1">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-semibold">{m.label}</span>
                    <span className="opacity-80">
                      <strong>{m.val}</strong> / {m.target} {m.unit} ({pct}%)
                    </span>
                  </div>
                  {/* Szare tło reprezentujące 100% celu */}
                  <div className="w-full h-3 rounded-full bg-gray-200 dark:bg-zinc-800 overflow-hidden relative">
                    <div
                      className={`h-full ${m.color} transition-all duration-500 rounded-full`}
                      style={{ width: `${pct}%` }}
                    />
                  </div>
                </div>
              );
            })}
          </div>

          {/* LISTA POSIŁKÓW */}
          <div className="space-y-2.5 pt-2">
            <h2 className="text-xs font-bold uppercase tracking-wider opacity-60 px-1">Zjedzone posiłki ({meals.length})</h2>
            {meals.length === 0 ? (
              <p className="text-center py-8 text-sm opacity-50 italic">Brak posiłków na ten dzień. Kliknij „+ Dodaj”, aby zacząć.</p>
            ) : (
              meals.map((meal) => (
                <div
                  key={meal.id}
                  className={`p-3.5 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 flex items-center justify-between transition-all`}
                >
                  <div className="space-y-0.5">
                    <h3 className="text-sm font-bold">{meal.name}</h3>
                    <p className="text-xs opacity-60">
                      {meal.components?.map(c => c.name).join(', ') || 'Posiłek'}
                    </p>
                    <p className="text-xs font-medium text-emerald-500">
                      {meal.totalCalories} kcal &bull; B: {meal.totalProtein}g &bull; W: {meal.totalCarbs}g &bull; T: {meal.totalFat}g
                    </p>
                  </div>
                  <div className="flex items-center space-x-1">
                    <button
                      onClick={() => onEditMeal(meal)}
                      className="p-2 rounded-xl hover:bg-black/10 dark:hover:bg-white/10 active:scale-90 text-blue-500"
                    >
                      <Icon name="pencil" className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => onDeleteMeal(meal.id)}
                      className="p-2 rounded-xl hover:bg-black/10 dark:hover:bg-white/10 active:scale-90 text-rose-500"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // --- WIDOK 2: KREATOR DODAWANIA POSIŁKU (Z dwuetapową logiką) ---
    function AddMealWizard({ selectedDate, apiKey, theme, favorites, onMealAdded }) {
      const [step, setStep] = useState(0); // 0: Wybór, 1: Co rozpoznano, 2: Ustal porcje
      const [mealName, setMealName] = useState('');
      const [components, setComponents] = useState([]);
      const [isFavorite, setIsFavorite] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const fileInputRef = useRef(null);

      const resetWizard = () => {
        setStep(0);
        setMealName('');
        setComponents([]);
        setIsFavorite(false);
        setIsLoading(false);
      };

      // KROK 1: Symulacja lub prawdziwe zapytanie Gemini
      const processAIInput = async (type, data) => {
        setIsLoading(true);
        try {
          if (type === 'label') {
            // Skanowanie etykiety: omija Krok 1, od razu daje wartości na 100g
            setTimeout(() => {
              setMealName('Przekąska / Produkt z etykiety');
              setComponents([
                {
                  name: 'Produkt z etykiety',
                  amount: 50,
                  selectedUnit: 'g',
                  isHeaped: false,
                  unitWeights: { 'g': 1, 'sztuka': 30, 'garść': 25 },
                  allowedUnits: ['g', 'sztuka', 'garść'],
                  caloriesPer100g: 480,
                  proteinPer100g: 6,
                  carbsPer100g: 58,
                  fatPer100g: 24
                }
              ]);
              setIsLoading(false);
              setStep(2);
            }, 600);
            return;
          }

          // Dla zdjęcia i tekstu: KROK 1 (Tylko co rozpoznano)
          setTimeout(() => {
            setMealName('Obiad domowy');
            setComponents([
              {
                name: 'Pierś z kurczaka pieczona',
                prepMethod: 'pieczona bez tłuszczu',
                amount: 1,
                selectedUnit: 'sztuka',
                isHeaped: false,
                unitWeights: { 'sztuka': 160, 'garść': 60, 'g': 1 },
                allowedUnits: ['sztuka', 'garść', 'g'],
                caloriesPer100g: 145,
                proteinPer100g: 31,
                carbsPer100g: 0,
                fatPer100g: 2.5
              },
              {
                name: 'Ziemniaki gotowane',
                prepMethod: 'z wody z koperkiem',
                amount: 2,
                selectedUnit: 'sztuka',
                isHeaped: false,
                unitWeights: { 'sztuka': 80, 'garść': 120, 'g': 1 },
                allowedUnits: ['sztuka', 'garść', 'g'],
                caloriesPer100g: 77,
                proteinPer100g: 2,
                carbsPer100g: 17,
                fatPer100g: 0.1
              }
            ]);
            setIsLoading(false);
            setStep(1);
          }, 800);
        } catch(e) {
          alert("Błąd analizy: " + e.message);
          setIsLoading(false);
        }
      };

      // Ładowanie z ulubionych
      const handleSelectFavorite = (fav) => {
        setMealName(fav.name);
        setComponents(JSON.parse(JSON.stringify(fav.components)));
        setStep(2);
      };

      // Wyliczanie sumy składników
      const totals = useMemo(() => {
        return components.reduce((acc, c) => {
          let weightInGrams = (c.unitWeights[c.selectedUnit] || 1) * c.amount;
          if (c.isHeaped && (c.selectedUnit === 'łyżka' || c.selectedUnit === 'łyżeczka')) {
            weightInGrams *= 1.6;
          }
          const ratio = weightInGrams / 100;
          acc.calories += Math.round(c.caloriesPer100g * ratio);
          acc.protein += Math.round(c.proteinPer100g * ratio);
          acc.carbs += Math.round(c.carbsPer100g * ratio);
          acc.fat += Math.round(c.fatPer100g * ratio);
          return acc;
        }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
      }, [components]);

      // Zapis do dziennika
      const handleSave = () => {
        const newMeal = {
          id: 'meal-' + Date.now(),
          name: mealName || 'Posiłek',
          components,
          totalCalories: totals.calories,
          totalProtein: totals.protein,
          totalCarbs: totals.carbs,
          totalFat: totals.fat,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        onMealAdded(newMeal, isFavorite);
        resetWizard();
      };

      return (
        <div className="space-y-4">
          {/* PASEK NAWIGACJI KREATORA ZE STRZAŁKĄ WSTECZ */}
          <div className="flex items-center justify-between pb-2 border-b border-black/5 dark:border-white/5">
            {step > 0 ? (
              <button onClick={() => setStep(step - 1)} className="p-2 -ml-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 active:scale-90">
                <Icon name="chevronLeft" className="w-5 h-5" />
              </button>
            ) : <div className="w-9" />}
            <h2 className="text-sm font-bold">
              {step === 0 && "Dodaj posiłek"}
              {step === 1 && "Krok 1: Co rozpoznano?"}
              {step === 2 && "Krok 2: Ustal porcje"}
            </h2>
            {step > 0 ? (
              <button onClick={resetWizard} className="p-2 -mr-2 rounded-xl text-xs opacity-60 hover:opacity-100">
                Anuluj
              </button>
            ) : <div className="w-9" />}
          </div>

          {isLoading && (
            <div className="text-center py-16 space-y-3">
              <div className="inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="text-xs font-medium opacity-70">Sztuczna inteligencja analizuje posiłek...</p>
            </div>
          )}

          {!isLoading && step === 0 && (
            <div className="space-y-3">
              <input
                type="file"
                accept="image/*"
                capture="environment"
                ref={fileInputRef}
                className="hidden"
                onChange={(e) => {
                  if (e.target.files[0]) processAIInput('photo', e.target.files[0]);
                }}
              />

              <button
                onClick={() => fileInputRef.current.click()}
                className={`w-full p-4 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 flex items-center space-x-3 active:scale-98 transition-transform`}
              >
                <div className="p-3 rounded-xl bg-emerald-500 text-white"><Icon name="camera" /></div>
                <div className="text-left">
                  <p className="text-sm font-bold">Zrób lub wczytaj zdjęcie</p>
                  <p className="text-xs opacity-60">AI rozpozna danie i dopyta o składniki</p>
                </div>
              </button>

              <button
                onClick={() => {
                  const text = prompt("Opisz krótko co zjadłeś (np. jajecznica z 3 jaj na maśle i 2 kromki chleba):");
                  if (text) processAIInput('text', text);
                }}
                className={`w-full p-4 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 flex items-center space-x-3 active:scale-98 transition-transform`}
              >
                <div className="p-3 rounded-xl bg-blue-500 text-white"><Icon name="type" /></div>
                <div className="text-left">
                  <p className="text-sm font-bold">Wpisz tekstowo</p>
                  <p className="text-xs opacity-60">Gdy nie masz zdjęcia, opisz posiłek słowami</p>
                </div>
              </button>

              <button
                onClick={() => processAIInput('label', null)}
                className={`w-full p-4 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 flex items-center space-x-3 active:scale-98 transition-transform`}
              >
                <div className="p-3 rounded-xl bg-amber-500 text-white"><Icon name="barcode" /></div>
                <div className="text-left">
                  <p className="text-sm font-bold">Skanuj Etykietę</p>
                  <p className="text-xs opacity-60">Pomiń Krok 1 i odczytaj wartości na 100g z tabeli</p>
                </div>
              </button>

              {/* ULUBIONE */}
              {favorites.length > 0 && (
                <div className="pt-3 space-y-2">
                  <h3 className="text-xs font-bold uppercase tracking-wider opacity-60 px-1">Z ulubionych (szybkie dodanie)</h3>
                  {favorites.map(fav => (
                    <button
                      key={fav.id}
                      onClick={() => handleSelectFavorite(fav)}
                      className={`w-full p-3 rounded-xl border ${theme.border} bg-black/5 dark:bg-white/5 text-left text-xs font-semibold flex justify-between items-center`}
                    >
                      <span>{fav.name}</span>
                      <Icon name="chevronRight" className="w-4 h-4 opacity-50" />
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* KROK 1: CO ROZPOZNANO (Edytowalne kafelki + dodawanie) */}
          {!isLoading && step === 1 && (
            <div className="space-y-3">
              <p className="text-xs opacity-70">Zweryfikuj listę składników przed wyliczeniem kalorii:</p>
              {components.map((c, i) => (
                <div key={i} className={`p-3 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 space-y-2`}>
                  <div className="flex items-center justify-between">
                    <input
                      type="text"
                      value={c.name}
                      onChange={(e) => {
                        const next = [...components];
                        next[i].name = e.target.value;
                        setComponents(next);
                      }}
                      className="bg-transparent font-bold text-sm w-full outline-none"
                    />
                    <button
                      onClick={() => setComponents(components.filter((_, idx) => idx !== i))}
                      className="text-rose-500 p-1"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                  <input
                    type="text"
                    placeholder="Sposób przygotowania (np. smażone na maśle)"
                    value={c.prepMethod || ''}
                    onChange={(e) => {
                      const next = [...components];
                      next[i].prepMethod = e.target.value;
                      setComponents(next);
                    }}
                    className="w-full text-xs p-2 rounded-lg bg-black/5 dark:bg-white/10 outline-none"
                  />
                </div>
              ))}

              <button
                onClick={() => {
                  setComponents([...components, {
                    name: 'Nowy składnik',
                    prepMethod: '',
                    amount: 1,
                    selectedUnit: 'sztuka',
                    isHeaped: false,
                    unitWeights: { 'sztuka': 100, 'g': 1 },
                    allowedUnits: ['sztuka', 'g'],
                    caloriesPer100g: 100,
                    proteinPer100g: 5,
                    carbsPer100g: 10,
                    fatPer100g: 2
                  }]);
                }}
                className="w-full py-2.5 rounded-xl border border-dashed border-emerald-500/50 text-emerald-500 text-xs font-bold"
              >
                + Dodaj kolejny składnik
              </button>

              <button
                onClick={() => setStep(2)}
                className="w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-bold text-sm shadow-md active:scale-98 transition-transform"
              >
                Dalej: Ustal porcje
              </button>
            </div>
          )}

          {/* KROK 2: USTALANIE PORCJI I KOREKTA */}
          {!isLoading && step === 2 && (
            <div className="space-y-4">
              {/* PODSUMOWANIE WARTOŚCI NA ŻYWO */}
              <div className={`p-3.5 rounded-2xl border ${theme.border} bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-center`}>
                <p className="text-xl font-black">{totals.calories} kcal</p>
                <p className="text-xs font-semibold mt-0.5">
                  Białko: {totals.protein}g &bull; Węgle: {totals.carbs}g &bull; Tłuszcze: {totals.fat}g
                </p>
              </div>

              {/* LISTA SKŁADNIKÓW Z OSOBNYMI SUWAKAMI */}
              {components.map((c, i) => (
                <div key={i} className={`p-3.5 rounded-2xl border ${theme.border} bg-black/5 dark:bg-white/5 space-y-3`}>
                  <div className="flex justify-between items-center">
                    <span className="text-sm font-bold">{c.name}</span>
                    <span className="text-xs font-semibold opacity-70">
                      {c.amount} {c.selectedUnit} {c.isHeaped ? '(czubata)' : ''}
                    </span>
                  </div>

                  {/* KAFELKI JEDNOSTEK Z PRZELICZNIKIEM W GRAMACH */}
                  <div className="grid grid-cols-3 gap-1.5">
                    {c.allowedUnits.map(unit => {
                      const approxGram = (c.unitWeights[unit] || 0) * (c.isHeaped && (unit === 'łyżka' || unit === 'łyżeczka') ? 1.6 : 1);
                      const isSel = c.selectedUnit === unit;
                      return (
                        <button
                          key={unit}
                          onClick={() => {
                            const next = [...components];
                            next[i].selectedUnit = unit;
                            setComponents(next);
                          }}
                          className={`py-1.5 px-2 rounded-xl text-xs flex flex-col items-center justify-center border transition-all ${isSel ? 'border-emerald-500 bg-emerald-500/10 font-bold text-emerald-500' : 'border-black/5 dark:border-white/5 opacity-70'}`}
                        >
                          <span>{unit}</span>
                          {unit !== 'g' && <span className="text-[10px] opacity-60">~{Math.round(approxGram)}g</span>}
                        </button>
                      );
                    })}
                  </div>

                  {/* OPCJA CZUBATEJ ŁYŻKI */}
                  {(c.selectedUnit === 'łyżka' || c.selectedUnit === 'łyżeczka') && (
                    <label className="flex items-center space-x-2 text-xs font-medium cursor-pointer pt-1">
                      <input
                        type="checkbox"
                        checked={c.isHeaped}
                        onChange={(e) => {
                          const next = [...components];
                          next[i].isHeaped = e.target.checked;
                          setComponents(next);
                        }}
                        className="rounded text-emerald-500 focus:ring-0"
                      />
                      <span>Czubata łyżka (+60% wagi)</span>
                    </label>
                  )}

                  {/* PRECYZYJNY SUWAK Z LIMITAMI */}
                  <div className="space-y-1">
                    <input
                      type="range"
                      min={c.selectedUnit === 'g' ? 10 : 0.5}
                      max={c.selectedUnit === 'g' ? 500 : 8}
                      step={c.selectedUnit === 'g' ? 10 : 0.5}
                      value={c.amount}
                      onChange={(e) => {
                        const next = [...components];
                        next[i].amount = parseFloat(e.target.value);
                        setComponents(next);
                      }}
                      className="w-full accent-emerald-500 cursor-pointer"
                    />
                  </div>
                </div>
              ))}

              {/* SERDUSZKO: DODAJ DO ULUBIONYCH */}
              <div className="flex items-center justify-between px-2 pt-2">
                <button
                  type="button"
                  onClick={() => setIsFavorite(!isFavorite)}
                  className="flex items-center space-x-2 text-xs font-semibold"
                >
                  <Icon
                    name="heart"
                    className={`w-5 h-5 transition-colors ${isFavorite ? 'text-rose-500 fill-rose-500' : 'opacity-40'}`}
                    filled={isFavorite}
                  />
                  <span>{isFavorite ? "Zapisano w Ulubionych" : "Zapisz do Ulubionych"}</span>
                </button>
              </div>

              {/* PRZYCISK ZAPISU DO DZIENNIKA */}
              <button
                onClick={handleSave}
                className="w-full py-4 rounded-2xl bg-emerald-500 text-white font-bold text-sm shadow-lg active:scale-98 transition-transform"
              >
                Zapisz posiłek do dziennika
              </button>
            </div>
          )}
        </div>
      );
    }

    // --- MODAL EDYCJI POSIŁKU (Z historią i globalnym suwakiem %) ---
    function EditMealModal({ meal, theme, onClose, onSave }) {
      const [mealName, setMealName] = useState(meal.name);
      const [portionMultiplier, setPortionMultiplier] = useState(100);
      const [isFavorite, setIsFavorite] = useState(false);

      const computedTotals = useMemo(() => {
        const ratio = portionMultiplier / 100;
        return {
          calories: Math.round(meal.totalCalories * ratio),
          protein: Math.round(meal.totalProtein * ratio),
          carbs: Math.round(meal.totalCarbs * ratio),
          fat: Math.round(meal.totalFat * ratio),
        };
      }, [meal, portionMultiplier]);

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`w-full max-w-sm rounded-3xl p-5 border ${theme.border} ${theme.bg} ${theme.text} space-y-4 shadow-2xl`}>
            <div className="flex justify-between items-center">
              <h3 className="text-base font-bold">Edytuj posiłek</h3>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-gray-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <input
              type="text"
              value={mealName}
              onChange={(e) => setMealName(e.target.value)}
              className="w-full p-2.5 rounded-xl border border-black/10 dark:border-white/10 bg-transparent text-sm font-semibold outline-none"
            />

            {/* SUWAK GLOBALNY PORCJI */}
            <div className="space-y-1.5 p-3 rounded-2xl bg-black/5 dark:bg-white/5">
              <div className="flex justify-between text-xs font-semibold">
                <span>Wielkość porcji:</span>
                <span className="text-emerald-500 font-bold">{portionMultiplier}%</span>
              </div>
              <input
                type="range"
                min="25"
                max="250"
                step="5"
                value={portionMultiplier}
                onChange={(e) => setPortionMultiplier(parseInt(e.target.value))}
                className="w-full accent-emerald-500 cursor-pointer"
              />
            </div>

            <div className="text-center text-xs opacity-70">
              Nowe wartości: <strong>{computedTotals.calories} kcal</strong> (B: {computedTotals.protein}g, W: {computedTotals.carbs}g, T: {computedTotals.fat}g)
            </div>

            <div className="flex items-center space-x-2 pt-1">
              <button
                type="button"
                onClick={() => setIsFavorite(!isFavorite)}
                className="flex items-center space-x-2 text-xs font-semibold"
              >
                <Icon
                  name="heart"
                  className={`w-5 h-5 ${isFavorite ? 'text-rose-500 fill-rose-500' : 'opacity-40'}`}
                  filled={isFavorite}
                />
                <span>Zapisz ten posiłek do Ulubionych</span>
              </button>
            </div>

            <button
              onClick={() => {
                onSave({
                  ...meal,
                  name: mealName,
                  totalCalories: computedTotals.calories,
                  totalProtein: computedTotals.protein,
                  totalCarbs: computedTotals.carbs,
                  totalFat: computedTotals.fat,
                }, isFavorite);
              }}
              className="w-full py-3.5 rounded-2xl bg-emerald-500 text-white font-bold text-sm shadow-md active:scale-98"
            >
              Zapisz zmiany
            </button>
          </div>
        </div>
      );
    }

    // --- WIDOK 3: PROFIL I USTAWIENIA ---
    function ProfileView({ profile, setProfile, targets, apiKey, setApiKey, theme, setTheme, themeObj, dailyLogs, setDailyLogs }) {
      const handleInputChange = (field, val) => {
        setProfile(prev => ({ ...prev, [field]: val }));
      };

      // Eksport bazy do pliku JSON
      const exportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dailyLogs));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `nutriai_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      return (
        <div className="space-y-5">
          {/* PODSUMOWANIE DZIENNYCH CELÓW */}
          <div className={`p-4 rounded-3xl border ${themeObj.border} bg-emerald-500/10 grid grid-cols-4 gap-2 text-center`}>
            <div>
              <p className="text-[10px] uppercase font-bold opacity-60">Kalorie</p>
              <p className="text-sm font-black text-emerald-600 dark:text-emerald-400">{targets.calories}</p>
            </div>
            <div>
              <p className="text-[10px] uppercase font-bold opacity-60">Białko</p>
              <p className="text-sm font-black text-blue-500">{targets.protein}g</p>
            </div>
            <div>
              <p className="text-[10px] uppercase font-bold opacity-60">Węgle</p>
              <p className="text-sm font-black text-amber-500">{targets.carbs}g</p>
            </div>
            <div>
              <p className="text-[10px] uppercase font-bold opacity-60">Tłuszcz</p>
              <p className="text-sm font-black text-rose-500">{targets.fat}g</p>
            </div>
          </div>

          {/* WYBÓR MOTYWU (6 KAFELKÓW) */}
          <div className="space-y-2">
            <h3 className="text-xs font-bold uppercase tracking-wider opacity-60 px-1">Wygląd aplikacji (Motyw)</h3>
            <div className="grid grid-cols-3 gap-2">
              {THEMES.map(t => (
                <button
                  key={t.id}
                  onClick={() => setTheme(t.id)}
                  className={`p-2.5 rounded-2xl border text-xs font-semibold flex items-center justify-center space-x-2 transition-all ${theme === t.id ? 'border-emerald-500 bg-emerald-500/10 text-emerald-500 shadow-sm' : 'border-black/5 dark:border-white/5 opacity-70'}`}
                >
                  <span className={`w-3 h-3 rounded-full ${t.primary}`}></span>
                  <span>{t.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* DANE CIAŁA I CEL */}
          <div className={`p-4 rounded-2xl border ${themeObj.border} bg-black/5 dark:bg-white/5 space-y-3`}>
            <h3 className="text-xs font-bold uppercase tracking-wider opacity-60">Kalkulator Zapotrzebowania</h3>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[10px] opacity-60 font-semibold">Płeć</label>
                <select
                  value={profile.gender}
                  onChange={(e) => handleInputChange('gender', e.target.value)}
                  className="w-full mt-1 p-2 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold outline-none"
                >
                  <option value="male">Mężczyzna</option>
                  <option value="female">Kobieta</option>
                </select>
              </div>

              <div>
                <label className="text-[10px] opacity-60 font-semibold">Wiek (lata)</label>
                <input
                  type="number"
                  value={profile.age}
                  onChange={(e) => handleInputChange('age', e.target.value)}
                  className="w-full mt-1 p-2 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold outline-none"
                />
              </div>

              <div>
                <label className="text-[10px] opacity-60 font-semibold">Waga (kg)</label>
                <input
                  type="number"
                  value={profile.weight}
                  onChange={(e) => handleInputChange('weight', e.target.value)}
                  className="w-full mt-1 p-2 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold outline-none"
                />
              </div>

              <div>
                <label className="text-[10px] opacity-60 font-semibold">Wzrost (cm)</label>
                <input
                  type="number"
                  value={profile.height}
                  onChange={(e) => handleInputChange('height', e.target.value)}
                  className="w-full mt-1 p-2 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold outline-none"
                />
              </div>
            </div>

            <div>
              <label className="text-[10px] opacity-60 font-semibold">Cel sylwetkowy</label>
              <select
                value={profile.goal}
                onChange={(e) => handleInputChange('goal', e.target.value)}
                className="w-full mt-1 p-2 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-semibold outline-none"
              >
                <option value="cut">Redukcja tłuszczu (-400 kcal)</option>
                <option value="maintain">Utrzymanie wagi</option>
                <option value="bulk">Budowa masy mięśniowej (+300 kcal)</option>
              </select>
            </div>
          </div>

          {/* KLUCZ GEMINI API */}
          <div className={`p-4 rounded-2xl border ${themeObj.border} bg-black/5 dark:bg-white/5 space-y-2`}>
            <h3 className="text-xs font-bold uppercase tracking-wider opacity-60">Klucz Gemini API (Opcjonalnie)</h3>
            <p className="text-[11px] opacity-60">Wpisz swój darmowy klucz z Google AI Studio, aby aplikacja odpytywała prawdziwy model Gemini.</p>
            <input
              type="password"
              placeholder="AIzaSy..."
              value={apiKey}
              onChange={(e) => setApiKey(e.target.value)}
              className="w-full p-2.5 rounded-xl bg-black/5 dark:bg-white/10 text-xs font-mono outline-none"
            />
          </div>

          {/* BACKUP DANYCH */}
          <div className="pt-2">
            <button
              onClick={exportData}
              className="w-full py-3 rounded-2xl border border-black/10 dark:border-white/10 text-xs font-bold opacity-80 hover:opacity-100"
            >
              Eksportuj historię do pliku (JSON)
            </button>
          </div>
        </div>
      );
    }

    // Renderowanie aplikacji do elementu #root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
